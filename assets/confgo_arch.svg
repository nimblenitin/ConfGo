<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="gradUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="gradUI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="gradAPI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="gradGraph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="gradAgent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="gradMCP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="gradLLM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="gradDB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="500" fill="#f8fafc" rx="12"/>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="355" y="20" width="150" height="50" rx="25" fill="url(#gradUser)"/>
    <text x="430" y="50" text-anchor="middle" fill="white" font-size="14" font-weight="600">User</text>
  </g>

  <!-- Arrow User -> UI -->
  <path d="M430 70 L430 100" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ConfGo UI -->
  <g filter="url(#shadow)">
    <rect x="330" y="100" width="200" height="50" rx="10" fill="url(#gradUI)"/>
    <text x="430" y="130" text-anchor="middle" fill="white" font-size="14" font-weight="600">ConfGo UI</text>
  </g>

  <!-- Arrow UI -> API -->
  <path d="M430 150 L430 180" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- FastAPI Server -->
  <g filter="url(#shadow)">
    <rect x="330" y="180" width="200" height="50" rx="10" fill="url(#gradAPI)"/>
    <text x="430" y="210" text-anchor="middle" fill="white" font-size="14" font-weight="600">FastAPI Server</text>
  </g>

  <!-- Arrow API -> Graph -->
  <path d="M430 230 L430 260" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- LangGraph Pipeline -->
  <g filter="url(#shadow)">
    <rect x="305" y="260" width="250" height="50" rx="10" fill="url(#gradGraph)"/>
    <text x="430" y="290" text-anchor="middle" fill="white" font-size="14" font-weight="600">LangGraph Pipeline</text>
  </g>

  <!-- Agent Boxes -->
  <g filter="url(#shadow)">
    <rect x="30" y="340" width="120" height="45" rx="8" fill="url(#gradAgent)"/>
    <text x="90" y="367" text-anchor="middle" fill="white" font-size="11" font-weight="600">Flight Agent</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="170" y="340" width="120" height="45" rx="8" fill="url(#gradAgent)"/>
    <text x="230" y="367" text-anchor="middle" fill="white" font-size="11" font-weight="600">Hotel Agent</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="310" y="340" width="120" height="45" rx="8" fill="url(#gradAgent)"/>
    <text x="370" y="367" text-anchor="middle" fill="white" font-size="11" font-weight="600">Weather Agent</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="450" y="340" width="130" height="45" rx="8" fill="url(#gradAgent)"/>
    <text x="515" y="367" text-anchor="middle" fill="white" font-size="11" font-weight="600">Itinerary Agent</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="600" y="340" width="120" height="45" rx="8" fill="url(#gradAgent)"/>
    <text x="660" y="367" text-anchor="middle" fill="white" font-size="11" font-weight="600">Final Agent</text>
  </g>

  <!-- Arrows from Graph to Agents -->
  <path d="M370 310 L90 340" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M400 310 L230 340" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M430 310 L370 340" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M460 310 L515 340" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M490 310 L660 340" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- MCP Servers -->
  <g filter="url(#shadow)">
    <rect x="30" y="410" width="100" height="40" rx="8" fill="url(#gradMCP)"/>
    <text x="80" y="435" text-anchor="middle" fill="white" font-size="10" font-weight="600">AviationStack</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="150" y="410" width="80" height="40" rx="8" fill="url(#gradMCP)"/>
    <text x="190" y="435" text-anchor="middle" fill="white" font-size="10" font-weight="600">Tavily</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="250" y="410" width="100" height="40" rx="8" fill="url(#gradMCP)"/>
    <text x="300" y="435" text-anchor="middle" fill="white" font-size="10" font-weight="600">OpenWeather</text>
  </g>

  <!-- LLM -->
  <g filter="url(#shadow)">
    <rect x="430" y="410" width="100" height="40" rx="8" fill="url(#gradLLM)"/>
    <text x="480" y="435" text-anchor="middle" fill="white" font-size="10" font-weight="600">Groq LLM</text>
  </g>

  <!-- PostgreSQL -->
  <g filter="url(#shadow)">
    <rect x="600" y="410" width="120" height="40" rx="8" fill="url(#gradDB)"/>
    <text x="660" y="435" text-anchor="middle" fill="white" font-size="10" font-weight="600">PostgreSQL</text>
  </g>

  <!-- Arrows from Agents to Services -->
  <path d="M90 385 L80 410" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M230 385 L190 410" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M370 385 L300 410" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M90 385 L480 410" stroke="#94a3b8" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M370 385 L480 410" stroke="#94a3b8" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M515 385 L480 410" stroke="#94a3b8" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M660 385 L480 410" stroke="#94a3b8" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M430 230 L660 410" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="430" y="480" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">ConfGo - Multi-Agent Conference Trip Planner</text>
</svg>
